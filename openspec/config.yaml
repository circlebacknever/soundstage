schema: spec-driven

context: |
  Tech stack: SvelteKit, TypeScript, browser Web Audio, localStorage.
  Product shape: local-first responsive music utility app for beginner guitar players.
  Engineering doctrine: prefer TDD, focused behavior tests, interface-first module design inspired by Ousterhout's deep modules, thin route files, and explicit browser-audio boundaries.
  Module ownership: src/routes owns SvelteKit URL adapters; src/lib/tools owns feature slices and page implementations; src/lib/app owns route and tool metadata; src/lib/music owns music theory and note math; src/lib/audio owns Web Audio, pitch detection, smoothing, and scheduling; src/lib/state owns local persistence; src/lib/ui owns reusable Svelte UI.
  Pitch detection is also a teaching exercise. Implementation plans should include lesson checkpoints that explain the concept, name the focused test, and summarize what passed.

rules:
  proposal:
    - Product capabilities must describe user-visible system behavior or durable product contracts.
    - Build-process guidance belongs in design.md, tasks.md, or this config rather than product capability specs.
  design:
    - Include deep module boundaries for non-trivial changes.
    - Name directories and ownership for shared code when the change spans UI, state, browser APIs, or domain logic.
    - Include test strategy for behavior changes before implementation sequencing.
  specs:
    - Specs must describe externally meaningful product behavior.
    - Avoid creating capability specs for workflow policy, coding style, or team process.
    - Keep teaching requirements in product specs only when teaching is part of the user-facing goal.
  tasks:
    - Order behavior work test-first: focused test, expected failure when practical, smallest implementation, focused verification, then refactor.
    - Name the target module path for each non-trivial task.
    - Include lesson checkpoints for pitch detection stages before implementation tasks consume the detector.
    - Keep route tasks thin by pushing reusable behavior into src/lib modules.
